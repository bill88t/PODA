# Port map table:
#
# system - reason
# 3306   - mariadb database database

services:
  mariadb:
    image: mariadb:12.2
    container_name: mariadb
    restart: unless-stopped
    hostname: mariadb
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    environment:
      MYSQL_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MARIADB_DATABASE}"
      MYSQL_USER: "${MARIADB_USER}"
      MYSQL_PASSWORD: "${MARIADB_PASSWORD}"
      TZ: "${TZ}"
    ports:
      - "3306:3306"
    logging:
      driver: journald
      options:
        tag: "Mariadb"
    volumes:
      - /docker/mariadb:/var/lib/mysql
    healthcheck:
      test: >
        sh -c "mariadb-admin ping -u ${MARIADB_USER} --password='${MARIADB_PASSWORD}' >/dev/null 2>&1"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
